services:
  web:
    container_name: info-web
    build:
      context: ..
      dockerfile: _web/deploy/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-}
        ANALYTICS_SRC: ${ANALYTICS_SRC:-}
        ANALYTICS_ID: ${ANALYTICS_ID:-}
        ANALYTICS_ID_ATTR: ${ANALYTICS_ID_ATTR:-}
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
