# Cache policy for the shared graph JSON payloads, keyed on the ?v=<sha1>
# cache-buster every in-app consumer appends (see app/build.sh + Base.astro).
# A versioned URL really is fingerprinted — content change ⇒ URL change — so
# it's safe to pin for a year. A BARE /adjacency.json is not: pinning that
# immutable meant any client that ever hit the unversioned URL (a crawler, a
# hand-typed link, an old cached page) froze a stale graph in its cache for a
# year with no way to revalidate. Short must-revalidate window instead.
# This file is mounted at conf.d/default.conf, i.e. http context, so `map`
# is legal here.
map $arg_v $graph_json_cache {
    ""      "public, max-age=300, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip. gzip_static serves a precompressed <file>.gz when one exists
    # (build.sh writes them at level 9), falling back to on-the-fly gzip for
    # anything without a sibling .gz. The win: max-level compression computed
    # once at build time instead of a weaker level recomputed per request.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/markdown
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # --- Security headers --------------------------------------------------
    # FOOTGUN: nginx drops ALL inherited add_header directives inside any
    # location that defines its own add_header. These server-level headers
    # therefore reach `location /` (directory-style pages — the bulk of the
    # site) by inheritance, but are REPEATED in the ~\.html$ and ~\.md$
    # locations below, which set their own Cache-Control. If you add headers
    # here, mirror them there too.
    #
    # CSP: 'unsafe-inline' on script/style is required because this is a
    # static build with a few inline bits (the window.__V bootstrap script,
    # JSON-LD, inline style attrs) and no server to mint per-request nonces.
    # The analytics origin is allowlisted explicitly — KEEP IN SYNC with
    # ANALYTICS_SRC in app/.env. frame-ancestors blocks clickjacking.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://zerolens.disinfo.zone; connect-src 'self' https://zerolens.disinfo.zone";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy $csp always;

    # Long cache for fingerprinted assets.
    #
    # NOTE on the shape of every block below: each one sets its own
    # Cache-Control, which per the FOOTGUN above cancels inheritance of the
    # server-level security headers — so each repeats them. nosniff is the
    # one that actually matters on non-document responses (it stops a .js or
    # .json being content-sniffed into something executable in a document
    # context); the rest are repeated so `curl -I` reports one consistent
    # header set for every URL on the site rather than a patchwork.
    #
    # Also note: `expires 1y` was removed from these blocks. It emits its own
    # Cache-Control, so pairing it with add_header produced TWO conflicting
    # Cache-Control headers on the same response (e.g. "max-age=31536000"
    # plus "public, immutable"). One header, set explicitly.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
        access_log off;
    }

    # Pagefind index assets — fingerprinted, safe to cache hard
    location /pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
        access_log off;
    }

    # Shared graph JSON payloads. Cache lifetime depends on whether the
    # request carried the ?v=<sha1> cache-buster — see $graph_json_cache.
    location = /adjacency.json {
        add_header Cache-Control $graph_json_cache;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
        access_log off;
    }
    location = /previews.json {
        add_header Cache-Control $graph_json_cache;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
        access_log off;
    }

    # llms.txt, sitemap.xml and the Atom feed are regenerated on every build
    # but cheap to serve. A short cache lets the CDN absorb crawler traffic
    # without masking a rebuild for long.
    location ~ ^/(llms\.txt|sitemap\.xml|feed\.xml)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # Clean URLs: try the exact path, then directory index, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # No-cache for top-level HTML and per-entity .md so updates land
    # immediately on rebuild. .md files are LLM-facing content that
    # rotates with the vault, same lifecycle as the HTML.
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        # Repeated: this location's own add_header above cancels inheritance.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
    }
    location ~ \.md$ {
        # nginx's bundled mime.types has no entry for .md, so without
        # this override the per-entity markdown companions get served
        # as application/octet-stream. Forcing the type via an empty
        # types{} + default_type avoids the foot-gun where declaring
        # `types{ text/markdown md; }` at server level wipes out the
        # entire inherited mime map.
        types { }
        default_type text/markdown;
        add_header Cache-Control "no-cache, must-revalidate";
        # Repeated: this location's own add_header above cancels inheritance.
        # nosniff matters most here — stops a .md being sniffed as HTML.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
    }

    error_page 404 /404.html;
    # Astro builds with directory format, so the 5xx page lives at
    # /5xx/index.html. 404.astro is special-cased into /404.html.
    error_page 500 502 503 504 /5xx/index.html;
}
