server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/markdown
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # Long cache for fingerprinted assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pagefind index assets — fingerprinted, safe to cache hard
    location /pagefind/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Shared graph JSON payloads. Every consumer appends ?v=<sha1> as a
    # cache-buster (see app/build.sh + Base.astro), so the URL changes
    # whenever the content does — meaning these are effectively
    # fingerprinted and safe to cache hard at the browser and CDN.
    location = /adjacency.json {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location = /previews.json {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # llms.txt + sitemap.xml are regenerated on every build but cheap to
    # serve. A short cache lets the CDN absorb crawler traffic without
    # masking a rebuild for long.
    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Clean URLs: try the exact path, then directory index, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # No-cache for top-level HTML and per-entity .md so updates land
    # immediately on rebuild. .md files are LLM-facing content that
    # rotates with the vault, same lifecycle as the HTML.
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~ \.md$ {
        # nginx's bundled mime.types has no entry for .md, so without
        # this override the per-entity markdown companions get served
        # as application/octet-stream. Forcing the type via an empty
        # types{} + default_type avoids the foot-gun where declaring
        # `types{ text/markdown md; }` at server level wipes out the
        # entire inherited mime map.
        types { }
        default_type text/markdown;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;
    # Astro builds with directory format, so the 5xx page lives at
    # /5xx/index.html. 404.astro is special-cased into /404.html.
    error_page 500 502 503 504 /5xx/index.html;
}
