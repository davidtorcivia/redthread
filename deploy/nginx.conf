server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # Long cache for fingerprinted assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pagefind index assets — fingerprinted, safe to cache hard
    location /pagefind/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Clean URLs: try the exact path, then directory index, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # No-cache for top-level HTML so updates land immediately on rebuild
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;
}
