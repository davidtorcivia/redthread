# nginx template for the built site. The official nginx image renders it with
# envsubst at startup; only ${ANALYTICS_ORIGIN} is substituted (see compose).

# Cache-Control per path. Headers are set once at server level: a location that
# adds its own add_header would drop every inherited one.
map $uri $cache_control {
    ~^/_astro/                                            "public, max-age=31536000, immutable";
    ~^/search-index/.*\.(pf_meta|pf_index|pf_fragment|pf_filter)$ "public, max-age=31536000, immutable";
    ~^/search-index/                                      "no-cache, must-revalidate";
    ~^/(adjacency|previews)\.json$                        $graph_json_cache;
    ~^/(llms\.txt|sitemap\.xml|feed\.xml)$                "public, max-age=3600, must-revalidate";
    ~\.(html|md)$                                         "no-cache, must-revalidate";
    default                                               "";
}

# Pages request the graph JSON with ?v=<content hash>, so only those URLs are immutable.
map $arg_v $graph_json_cache {
    ""      "public, max-age=300, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # build.sh writes .gz siblings at level 9.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/markdown
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # 'unsafe-inline' covers the small inline scripts a static build can't nonce.
    # 'wasm-unsafe-eval' lets Pagefind run its WebAssembly; JavaScript eval stays blocked.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' ${ANALYTICS_ORIGIN}; connect-src 'self' ${ANALYTICS_ORIGIN}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cache-Control $cache_control;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ ^/(_astro/|search-index/|adjacency\.json|previews\.json) {
        access_log off;
    }

    # nginx's mime.types has no .md entry. An empty types{} here avoids
    # replacing the whole inherited map.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /5xx/index.html;
}
