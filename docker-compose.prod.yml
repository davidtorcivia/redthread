# Production overlay. Merge with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from the base:
#   • restart: unless-stopped so the container survives reboots
#   • Host port bound to 127.0.0.1 instead of 0.0.0.0 — the site is
#     only reachable through whatever you have fronting it on this
#     host (your existing cloudflared, nginx, Caddy, etc.). Public
#     interfaces stay closed.
#   • Port number comes from $PORT in your .env file (default 8080)
#     so you can point cloudflared at whatever port you've designated.
#
# .env in this directory (next to the compose files), 600 / gitignored:
#
#   PORT=8080
#
# Then in your cloudflared config / Zero Trust tunnel:
#
#   public hostname: your.domain.com → http://localhost:8080

services:
  web:
    restart: unless-stopped
    ports: !reset
      - "127.0.0.1:${PORT:-8080}:80"
