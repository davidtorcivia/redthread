# Production overlay. Merge with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds:
#   • restart: unless-stopped on the web container so it survives reboots
#   • Cloudflare Tunnel sidecar exposing the site without opening a host
#     port. The web container binds only to the internal compose network;
#     cloudflared reaches it at http://web:80 and Cloudflare routes your
#     public hostname to it via your Zero Trust tunnel config.
#
# Configure your tunnel:
#   1. Zero Trust dashboard → Access → Tunnels → Create a tunnel
#   2. Copy the tunnel token
#   3. On the server, write `.env` next to this file:
#        CLOUDFLARE_TUNNEL_TOKEN=eyJh...
#   4. In the dashboard, add a public hostname for the tunnel routing
#      your domain → http://web:80
#
# .env should be 600 / gitignored. The token is the entire auth for the
# tunnel; treat it like a password.

services:
  web:
    restart: unless-stopped
    # Drop the host port binding from the base compose file — only the
    # cloudflared sidecar talks to web, over the internal compose network.
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: info-web-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    # No published ports — outbound-only connection to Cloudflare's edge.
